[project]
name = "agent-gateway-playground"
version = "0.1.0"
description = "Break an AI agent on purpose: a mock agent gateway you can run, with animated traces."
requires-python = ">=3.11"
dependencies = [
  "agent-framework-core>=1.19",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["playground"]
